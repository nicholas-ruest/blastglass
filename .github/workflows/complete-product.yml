name: Complete product exact-head
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Exact head binding
        env: {EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: 1.100.0, components: rustfmt,clippy}
      - uses: actions/setup-node@v4
        with: {node-version: 24.21.0, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs netavark aardvark-dns
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: (cd frontend && npx playwright install --with-deps chromium)
      - run: bash scripts/ci-bootstrap-upstreams.sh "$RUNNER_TEMP/blastglass-upstreams"
      - run: bash scripts/suite-rust.sh
      - run: bash scripts/suite-frontend.sh
      - name: Rust source floor
        run: node scripts/dream-machine-rust-share.mjs .
      - name: Fetch exact-source external evidence
        env: {EVIDENCE_URL: "${{ vars.DREAM_MACHINE_EVIDENCE_URL }}"}
        run: |
          test -n "$EVIDENCE_URL"
          curl --fail --location "$EVIDENCE_URL" -o evidence.tgz
          mkdir evidence-seed
          tar -xzf evidence.tgz -C evidence-seed
          test -f evidence-seed/seed/semantic-review.md
          test -f evidence-seed/seed/selection-report.json
      - name: Pinned complete-product controller
        env:
          DREAM_MACHINE_PRODUCER_RUN_ID: "${{ vars.DREAM_MACHINE_PRODUCER_RUN_ID }}"
          DREAM_MACHINE_SEMANTIC_REVIEW: "${{ github.workspace }}/evidence-seed/seed/semantic-review.md"
          DREAM_MACHINE_SELECTION_REPORT: "${{ github.workspace }}/evidence-seed/seed/selection-report.json"
          DREAM_MACHINE_SELECTION_EVIDENCE: "${{ github.workspace }}/evidence-seed/seed/selection-evidence"
          BLASTGLASS_UPSTREAM_ROOT: "${{ runner.temp }}/blastglass-upstreams"
          PLAYWRIGHT_BROWSERS_PATH: "${{ runner.temp }}/ms-playwright"
        run: mkdir ci-evidence && node scripts/dream-machine-publication-gate.mjs --check . ci-evidence
