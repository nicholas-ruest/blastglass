name: Complete product exact-head
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact head binding
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: 1.100.0, components: rustfmt,clippy}
      - uses: actions/setup-node@v4
        with: {node-version: 24.21.0, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: bash scripts/suite-rust.sh
      - run: bash scripts/suite-frontend.sh
      - name: Rust source floor
        run: node scripts/dream-machine-rust-share.mjs .
      - name: Fetch exact-source external evidence
        env: {EVIDENCE_URL: "${{ vars.DREAM_MACHINE_EVIDENCE_URL }}"}
        run: test -n "$EVIDENCE_URL" && curl --fail --location "$EVIDENCE_URL" -o evidence.tgz && mkdir evidence && tar -xzf evidence.tgz -C evidence
      - name: Pinned complete-product controller
        env: {DREAM_MACHINE_PRODUCER_RUN_ID: "${{ vars.DREAM_MACHINE_PRODUCER_RUN_ID }}"}
        run: node scripts/dream-machine-publication-gate.mjs --check . evidence
